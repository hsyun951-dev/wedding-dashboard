        :root {

            --primary-dark: #ff6f91;
            --bg-color: #fdfbfb;

            --text-color: #444;
            --muted: #888;
            --border: #e8e8e8;
            --danger: #d9534f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family:
                'Pretendard',
                -apple-system,
                BlinkMacSystemFont,
                system-ui,
                Roboto,
                sans-serif;

            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;

            display: flex;
            justify-content: center;

            color: var(--text-color);
        }

        #dashboard-container {
            width: 90%;
            max-width: 1100px;

            background: var(--card-bg);

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.05);
        }

        /* ================================
           제목
        ================================= */

        h1 {
            text-align: center;

            color: #444;

            margin:
                0 0 12px;
        }

        .subtitle {
            text-align: center;

            color: #999;

            font-size: 13px;

            margin-bottom: 18px;
        }

        /* ================================
           모바일 청첩장 버튼
        ================================= */

        .invitation-button-wrap {
            display: flex;

            justify-content: center;

            margin-bottom: 28px;
        }

        .invitation-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 6px;

            padding:
                11px 19px;

            border-radius: 999px;

            background:
                #fff0f3;

            border:
                1px solid #ffd1dc;

            color:
                var(--primary-dark);

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            transition:
                all 0.2s ease;
        }

        .invitation-button:hover {
            background:
                #ffe3e9;

            transform:
                translateY(-1px);

            box-shadow:
                0 4px 12px rgba(255,143,171,0.18);
        }

        /* ================================
           진행률
        ================================= */

        .progress-section {
            text-align: center;

            margin-bottom: 24px;

            padding: 20px;

            background:
                #fff5f7;

            border-radius: 15px;
        }

        .progress-text {
            font-size: 1.05rem;

            font-weight: 700;

            margin-bottom: 6px;

            color: #555;
        }

        .progress-detail {
            font-size: 0.9rem;

            color: var(--muted);

            margin:
                6px 0 12px;
        }

        .progress-bar-container {
            width: 100%;

            height: 28px;

            background:
                #e0e0e0;

            border-radius: 14px;

            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;

            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    #ff8fab 0%,
                    #ffb3c1 100%
                );

            transition:
                width 0.4s ease-in-out;

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-size: 0.9rem;

            font-weight: 700;
        }

        /* ================================
           버튼
        ================================= */

        .button-area {
            display: flex;

            justify-content: flex-end;

            margin-bottom: 15px;
        }

        button {
            font-family: inherit;
        }

        .add-button {
            border: none;

            background:
                var(--primary-color);

            color: white;

            font-size: 15px;

            font-weight: 700;

            padding:
                12px 18px;

            border-radius: 10px;

            cursor: pointer;

            transition:
                0.2s;
        }

        .add-button:hover {
            background:
                var(--primary-dark);

            transform:
                translateY(-1px);
        }

        /* ================================
           캘린더
        ================================= */

        #calendar {
            margin-top: 10px;
        }

        .fc-event {
            cursor: pointer;

            border: none !important;

            background:
                var(--primary-color) !important;

            padding:
                2px 5px;
        }

        .fc-event:hover {
            filter:
                brightness(0.97);
        }

        .wedding-day {
            background:
                #ff4d6d !important;

            border:
                2px solid #ff0000 !important;

            font-weight:
                700 !important;

            text-align:
                center !important;

            box-shadow:
                0 0 10px rgba(255,77,109,0.5);

            color:
                white !important;
        }

        /* ================================
           모달
        ================================= */

        .modal-overlay {
            display: none;

            position: fixed;

            z-index: 1000;

            inset: 0;

            background:
                rgba(0,0,0,0.4);

            align-items: center;

            justify-content: center;

            padding: 20px;
        }

        .modal {
            width: 100%;

            max-width: 450px;

            max-height: 90vh;

            overflow-y: auto;

            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.2);
        }

        .modal h2 {
            margin:
                0 0 20px;

            color: #444;
        }

        /* ================================
           입력 폼
        ================================= */

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 7px;

            color: #555;
        }

        .form-group input {
            width: 100%;

            padding:
                11px 12px;

            border:
                1px solid #ddd;

            border-radius:
                8px;

            font-size:
                15px;

            outline:
                none;
        }

        .form-group input:focus {
            border-color:
                var(--primary-color);
        }

        .helper-text {
            font-size: 12px;

            color: #999;

            margin-top: 5px;

            line-height: 1.5;
        }

        /* ================================
           모달 버튼
        ================================= */

        .modal-buttons {
            display: flex;

            gap: 10px;

            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;

            border: none;

            padding: 12px;

            border-radius: 9px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        .cancel-button {
            background:
                #eee;

            color:
                #555;
        }

        .save-button {
            background:
                var(--primary-color);

            color: white;
        }

        .edit-button {
            background:
                #fff0f3;

            color:
                var(--primary-dark);
        }

        .delete-button {
            width: 100%;

            margin-top: 20px;

            padding: 11px;

            border: none;

            border-radius: 9px;

            background:
                #f6f6f6;

            color:
                var(--danger);

            font-weight:
                700;

            cursor:
                pointer;
        }

        /* ================================
           상세정보
        ================================= */

        .detail-row {
            display: flex;

            padding: 11px 0;

            border-bottom:
                1px solid #eee;

            gap: 12px;
        }

        .detail-label {
            width: 70px;

            flex: 0 0 70px;

            font-weight: 700;

            color:
                var(--muted);
        }

        .detail-value {
            flex: 1;

            color:
                #444;

            word-break:
                break-word;
        }

        /* ================================
           모바일
        ================================= */

        @media (max-width: 600px) {

            body {

            }

                width: 100%;

                padding: 18px;
            }

                    1.45rem;
            }

            .progress-text {
                font-size:
                    1rem;
            }

            .fc-toolbar {
                flex-wrap:
                    wrap;

                gap:
                    8px;
            }

                font-size:
                    13px;

                padding:
                    10px 16px;
            }

</head>

<div id="dashboard-container">

    <!-- ============================
         제목
    ============================= -->

    <h1>
        💌 청첩장 모임 진행 현황
    </h1>

    <div class="subtitle">
        송재욱 💛 윤혜선
    </div>


    <!-- ============================
         모바일 청첩장
    ============================= -->

    <div class="invitation-button-wrap">

        <a
            class="invitation-button"
            href="https://www.heumcard.com/cards/jwhs261107"
            target="_blank"
            rel="noopener noreferrer"
        >
            💌 모바일 청첩장 보기
        </a>

    </div>


    <!-- ============================
         진행률
    ============================= -->

    <div class="progress-section">

        <div class="progress-text">
            모임
            <span id="completed-count">0</span>
            /
            <span id="total-count">0</span>
            건 완료
        </div>

        <div class="progress-text">
            인원
            <span id="completed-people">0</span>
            /
            <span id="total-people">0</span>
            명 완료
        </div>

        <div class="progress-detail">
            전체 진척률은 모임별 인원수를 기준으로 계산됩니다.
        </div>

        <div class="progress-bar-container">

            <div
                id="progress-fill"
                class="progress-bar-fill"
            >
                0%
            </div>

        </div>

    </div>


    <!-- ============================
         모임 추가 버튼
    ============================= -->

    <div class="button-area">

        <button
            class="add-button"
            onclick="openAddModal()"
        >
            ＋ 모임 추가
        </button>

    </div>


    <!-- ============================
         캘린더
    ============================= -->

    <div id="calendar"></div>

</div>


<!-- ==================================================
     모임 추가 / 수정 모달
================================================== -->

<div
    id="form-modal"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
>

    <div class="modal">

        <h2 id="form-modal-title">
            💌 모임 추가
        </h2>

        <div class="form-group">

            <label for="meeting-title">
                모임명
            </label>

            <input
                type="text"
                id="meeting-title"
                placeholder="예: 대학친구"
            >

        </div>


        <div class="form-group">

            <label for="meeting-date">
                날짜
            </label>

            <input
                type="date"
                id="meeting-date"
            >

        </div>


        <div class="form-group">

            <label for="meeting-people">
                인원수
            </label>

            <input
                type="number"
                id="meeting-people"
                min="0"
                step="1"
                placeholder="예: 8"
            >

            <div class="helper-text">
                실제 청첩장을 전달한 인원 기준으로 입력하면
                전체 진척률에 반영됩니다.
            </div>

        </div>


        <div class="form-group">

            <label for="meeting-location">
                장소
            </label>

            <input
                type="text"
                id="meeting-location"
                placeholder="예: 강남역 ○○식당"
            >

        </div>


        <div class="modal-buttons">

            <button
                class="cancel-button"
                onclick="closeFormModal()"
            >
                취소
            </button>

            <button
                class="save-button"
                onclick="saveMeeting()"
            >
                저장하기
            </button>

        </div>

    </div>
</div>


<!-- ==================================================
     상세정보 모달
================================================== -->

<div
    id="detail-modal"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
>

    <div class="modal">

        <h2 id="detail-title">
            모임 정보
        </h2>


        <div class="detail-row">

            <div class="detail-label">
                📅 날짜
            </div>

            <div
                class="detail-value"
                id="detail-date"
            ></div>

        </div>


        <div class="detail-row">

            <div class="detail-label">
                👥 인원
            </div>

            <div
                class="detail-value"
                id="detail-people"
            ></div>

        </div>


        <div class="detail-row">

            <div class="detail-label">
                📍 장소
            </div>

            <div
                class="detail-value"
                id="detail-location"
            ></div>

        </div>


        <div class="modal-buttons">

            <button
                class="cancel-button"
                onclick="closeDetailModal()"
            >
                닫기
            </button>

            <button
                class="edit-button"
                onclick="editSelectedMeeting()"
            >
                ✏️ 수정
            </button>

        </div>


        <button
            class="delete-button"
            onclick="deleteSelectedMeeting()"
        >
            이 모임 삭제
        </button>

    </div>
</div>

                location: '강남',
                type: 'meeting'
            },

            {
                title: '대학 여자동기',
                start: '2026-10-09',
                attendees: 4,
                location: '용산역 핸드앤몰트 브루랩',
                type: 'meeting'
            },

            {
                title: '고등학교 공연기획',
                start: '2026-10-10',
                attendees: 3,
                location: '신사역',
                type: 'meeting'
            },

            {
                title: '유생문화동아리 합동청모',
                start: '2026-10-11',
                attendees: 6,
                location: '강남역',
                type: 'meeting'
            },

            {
                title: '합창단 합동청모',
                start: '2026-10-18',
                attendees: 23,
                location: '명륜',
                type: 'meeting'
            },

            {
                title: '줄리안',
                start: '2026-10-19',
                attendees: 5,
                location: '북광장',
                type: 'meeting'
            }

        ];


        /* ======================================
           결혼식
        ====================================== */

        const weddingEvent = {

            title:
                '❤️ 결혼식 ❤️',

            start:
                '2026-11-07',

            className:
                'wedding-day',

            type:
                'wedding'

        };


        /* ======================================
           상태
        ====================================== */

        let meetings =
            loadMeetings();

        let editingIndex =
            null;

        let selectedIndex =
            null;


        /* ======================================
           ID 생성
        ====================================== */

        function makeId() {

            return (
                'm_' +
                Date.now() +
                '_' +
                Math.random()
                    .toString(36)
                    .slice(2, 8)
            );

        }


        /* ======================================
           데이터 정리
        ====================================== */

        function normalizeMeeting(
            meeting
        ) {

            return {

                id:
                    meeting.id ||
                    makeId(),

                title:
                    String(
                        meeting.title ||
                        '제목 없음'
                    ),

                start:
                    String(
                        meeting.start ||
                        ''
                    ),

                attendees:
                    Math.max(
                        0,
                        Number(
                            meeting.attendees
                        ) || 0
                    ),

                location:
                    String(
                        meeting.location ||
                        '미정'
                    ),

                type:
                    'meeting'

            };

        }


        /* ======================================
           LocalStorage 불러오기
        ====================================== */

        function loadMeetings() {

            try {

                const saved =
                    localStorage.getItem(
                        STORAGE_KEY
                    );


                if (saved) {

                    const parsed =
                        JSON.parse(
                            saved
                        );


                    if (
                        Array.isArray(
                            parsed
                        )
                    ) {

                        return parsed.map(
                            normalizeMeeting
                        );

                    }

                }

            } catch (error) {

                console.warn(
                    '저장된 데이터를 불러오지 못했습니다.',
                    error
                );

            }


            return defaultMeetings.map(
                meeting => ({
                    ...meeting,
                    id: makeId()
                })
            );

        }


        /* ======================================
           저장
        ====================================== */

        function persist() {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(
                    meetings
                )
            );

        }


        /* ======================================
           완료 여부
        ====================================== */

        function isCompleted(
            meeting
        ) {

            const today =
                new Date();


            today.setHours(
                0,
                0,
                0,
                0
            );


            const eventDate =
                new Date(
                    meeting.start +
                    'T00:00:00'
                );


            return (
                eventDate <= today
            );

        }


        /* ======================================
           진행률
        ====================================== */

        function updateProgress() {

            const totalMeetings =
                meetings.length;


            const completedMeetings =
                meetings.filter(
                    isCompleted
                ).length;


            const totalPeople =
                meetings.reduce(
                    (
                        sum,
                        meeting
                    ) => {

                        return (
                            sum +
                            (
                                Number(
                                    meeting.attendees
                                ) || 0
                            )
                        );

                    },
                    0
                );


            const completedPeople =
                meetings
                    .filter(
                        isCompleted
                    )
                    .reduce(
                        (
                            sum,
                            meeting
                        ) => {

                            return (
                                sum +
                                (
                                    Number(
                                        meeting.attendees
                                    ) || 0
                                )
                            );

                        },
                        0
                    );


            const percentage =
                totalPeople === 0
                    ? 0
                    : Math.round(
                        (
                            completedPeople /
                            totalPeople
                        ) * 100
                    );


            document.getElementById(
                'total-count'
            ).textContent =
                totalMeetings;


            document.getElementById(
                'completed-count'
            ).textContent =
                completedMeetings;


            document.getElementById(
                'total-people'
            ).textContent =
                totalPeople;


            document.getElementById(
                'completed-people'
            ).textContent =
                completedPeople;


            const fill =
                document.getElementById(
                    'progress-fill'
                );


            fill.style.width =
                percentage + '%';


            fill.textContent =
                percentage + '%';

        }


        /* ======================================
           FullCalendar
        ====================================== */

        const calendar =
            new FullCalendar.Calendar(

                document.getElementById(
                    'calendar'
                ),

                {

                    initialView:
                        'dayGridMonth',

                    locale:
                        'ko',

                    initialDate:
                        new Date(),

                    validRange: {

                        start:
                            '2026-07-01',

                        end:
                            '2026-11-08'

                    },

                    headerToolbar: {

                        left:
                            'prev,next today',

                        center:
                            'title',

                        right:
                            'dayGridMonth,dayGridWeek'

                    },


                    events:
                        function(
                            fetchInfo,
                            successCallback
                        ) {

                            const calendarMeetings =
                                meetings.map(
                                    meeting => ({

                                        ...meeting,

                                        color:
                                            '#ff8fab',

                                        extendedProps: {

                                            type:
                                                'meeting',

                                            attendees:
                                                meeting.attendees,

                                            location:
                                                meeting.location,

                                            meetingId:
                                                meeting.id

                                        }

                                    })
                                );


                            successCallback([

                                ...calendarMeetings,

                                weddingEvent

                            ]);

                        },


                    eventClick:
                        function(info) {

                            if (
                                info.event
                                    .extendedProps
                                    .type ===
                                'wedding'
                            ) {

                                alert(
                                    '💍 2026년 11월 7일 결혼식 💍'
                                );

                                return;

                            }


                            const meetingId =
                                info.event
                                    .extendedProps
                                    .meetingId;


                            const index =
                                meetings.findIndex(
                                    meeting =>
                                        meeting.id ===
                                        meetingId
                                );


                            if (
                                index !== -1
                            ) {

                                showMeetingDetail(
                                    index
                                );

                            }

                        }

                }

            );


        calendar.render();


        /* ======================================
           추가 모달 열기
        ====================================== */

        window.openAddModal =
            function() {

                editingIndex =
                    null;


                document.getElementById(
                    'form-modal-title'
                ).textContent =
                    '💌 모임 추가';


                document.getElementById(
                    'meeting-title'
                ).value =
                    '';


                document.getElementById(
                    'meeting-date'
                ).value =
                    '';


                document.getElementById(
                    'meeting-people'
                ).value =
                    '';


                document.getElementById(
                    'meeting-location'
                ).value =
                    '';


                openModal(
                    'form-modal'
                );


                document.getElementById(
                    'meeting-title'
                ).focus();

            };


        /* ======================================
           수정 모드
        ====================================== */

        window.editSelectedMeeting =
            function() {

                if (
                    selectedIndex ===
                    null
                ) {
                    return;
                }


                const meeting =
                    meetings[
                        selectedIndex
                    ];


                editingIndex =
                    selectedIndex;


                document.getElementById(
                    'form-modal-title'
                ).textContent =
                    '✏️ 모임 수정';


                document.getElementById(
                    'meeting-title'
                ).value =
                    meeting.title;


                document.getElementById(
                    'meeting-date'
                ).value =
                    meeting.start;


                document.getElementById(
                    'meeting-people'
                ).value =
                    meeting.attendees;


                document.getElementById(
                    'meeting-location'
                ).value =
                    meeting.location === '미정'
                        ? ''
                        : meeting.location;


                closeDetailModal();


                openModal(
                    'form-modal'
                );


                document.getElementById(
                    'meeting-title'
                ).focus();

            };


        /* ======================================
           모임 저장
        ====================================== */

        window.saveMeeting =
            function() {

                const title =
                    document.getElementById(
                        'meeting-title'
                    ).value.trim();


                const date =
                    document.getElementById(
                        'meeting-date'
                    ).value;


                const peopleValue =
                    document.getElementById(
                        'meeting-people'
                    ).value;


                const location =
                    document.getElementById(
                        'meeting-location'
                    ).value.trim() ||
                    '미정';


                /* 입력값 검사 */

                if (!title) {

                    alert(
                        '모임명을 입력해주세요.'
                    );

                    return;

                }


                if (!date) {

                    alert(
                        '날짜를 선택해주세요.'
                    );

                    return;

                }


                const attendees =
                    Number(
                        peopleValue
                    );


                if (
                    !Number.isInteger(
                        attendees
                    ) ||
                    attendees < 0
                ) {

                    alert(
                        '인원수는 0 이상의 정수로 입력해주세요.'
                    );

                    return;

                }


                /* 새 모임 */

                if (
                    editingIndex ===
                    null
                ) {

                    meetings.push({

                        id:
                            makeId(),

                        title:
                            title,

                        start:
                            date,

                        attendees:
                            attendees,

                        location:
                            location,

                        type:
                            'meeting'

                    });

                }

                /* 기존 모임 수정 */

                else {

                    meetings[
                        editingIndex
                    ] = {

                        ...meetings[
                            editingIndex
                        ],

                        title:
                            title,

                        start:
                            date,

                        attendees:
                            attendees,

                        location:
                            location,

                        type:
                            'meeting'

                    };

                }


                persist();

                calendar.refetchEvents();

                updateProgress();


                const wasEditing =
                    editingIndex !== null;


                closeFormModal();


                editingIndex =
                    null;


                alert(
                    wasEditing
                        ? '모임 정보가 수정되었습니다! 💌'
                        : '모임이 추가되었습니다! 💌'
                );

            };


        /* ======================================
           상세정보
        ====================================== */

        function showMeetingDetail(
            index
        ) {

            selectedIndex =
                index;


            const meeting =
                meetings[
                    index
                ];


            document.getElementById(
                'detail-title'
            ).textContent =
                meeting.title;


            document.getElementById(
                'detail-date'
            ).textContent =
                formatDate(
                    meeting.start
                );


            document.getElementById(
                'detail-people'
            ).textContent =
                `${meeting.attendees}명`;


            document.getElementById(
                'detail-location'
            ).textContent =
                meeting.location ||
                '미정';


            openModal(
                'detail-modal'
            );

        }


        /* ======================================
           삭제
        ====================================== */

        window.deleteSelectedMeeting =
            function() {

                if (
                    selectedIndex ===
                    null
                ) {

                    return;

                }


                const meeting =
                    meetings[
                        selectedIndex
                    ];


                const confirmed =
                    confirm(
                        `"${meeting.title}" 모임을 삭제할까요?`
                    );


                if (!confirmed) {

                    return;

                }


                meetings.splice(
                    selectedIndex,
                    1
                );


                persist();

                calendar.refetchEvents();

                updateProgress();

                closeDetailModal();

            };


        /* ======================================
           날짜 포맷
        ====================================== */

        function formatDate(
            dateString
        ) {

            const date =
                new Date(
                    dateString +
                    'T00:00:00'
                );


            const year =
                date.getFullYear();


            const month =
                String(
                    date.getMonth() + 1
                ).padStart(
                    2,
                    '0'
                );


            const day =
                String(
                    date.getDate()
                ).padStart(
                    2,
                    '0'
                );


            return (
                `${year}년 ${month}월 ${day}일`
            );

        }


        /* ======================================
           모달 열기 / 닫기
        ====================================== */

        function openModal(
            id
        ) {

            document.getElementById(
                id
            ).style.display =
                'flex';

        }


        function closeModal(
            id
        ) {

            document.getElementById(
                id
            ).style.display =
                'none';

        }


        window.closeFormModal =
            function() {

                closeModal(
                    'form-modal'
                );

                editingIndex =
                    null;

            };


        window.closeDetailModal =
            function() {

                closeModal(
                    'detail-modal'
                );

                selectedIndex =
                    null;

            };


        /* ======================================
           바깥 영역 클릭으로 닫기
        ====================================== */

        document.getElementById(
            'form-modal'
        ).addEventListener(
            'click',
            function(event) {

                if (
                    event.target ===
                    this
                ) {

                    closeFormModal();

                }

            }
        );


        document.getElementById(
            'detail-modal'
        ).addEventListener(
            'click',
            function(event) {

                if (
                    event.target ===
                    this
                ) {

                    closeDetailModal();

                }

            }
        );


        /* ======================================
           ESC로 닫기
        ====================================== */

        document.addEventListener(
            'keydown',
            function(event) {

                if (
                    event.key ===
                    'Escape'
                ) {

                    closeFormModal();

                    closeDetailModal();

                }

            }
        );


        /* ======================================
           최초 실행
        ====================================== */

        updateProgress();

    });

</script>

</body>
</html>
